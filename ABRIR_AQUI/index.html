Com motor, estrutura e instalação de uma linha, estimamos esta faixa.",refs:[xe.belt]},rotuladora:{min:4e4,max:14e4,note:"Rotuladoras de luva termo-encolhível: US$ 7 mil a 25 mil (até 100–150 garrafas/min).",refs:[xe.label]},recepcao_fruta:{min:2e4,max:8e4,note:"Sem preço encontrado: estimativa por analogia com esteiras e moegas de recebimento.",refs:[]},lavadora_frutas:{min:25e3,max:6e4,note:"Anúncios de lavadoras de bolhas ficam entre US$ 4,5 mil e 6 mil (300 a 5.000 kg/h), em sites de revenda: fonte fraca, sem link confiável.",refs:[]},extratora:{min:15e4,max:6e5,note:"Extratoras comerciais pequenas custam US$ 0,5 a 2 mil (20–25 laranjas/min). Uma industrial de 1,3 t/h é de outra escala: estimativa.",refs:[xe.juicer]},filtro_despolpadeira:{min:2e4,max:8e4,note:"Despolpadeiras de 0,5 a 2,5 t/h: de ~US$ 1 mil a US$ 11 mil.",refs:[xe.pulper]},envasadora_suco:{min:2e5,max:5e5,note:"Enchedora de 4 bicos com tampadora a ~800 garrafas/h: US$ 52 mil (≈ R$ 286 mil).",refs:[xe.fill3]},camara_fria:{min:12e4,max:25e4,note:"Câmaras frias de 10 a 40 m³: US$ 14 mil a 31 mil (cerca de US$ 580 a 1.400 por m³), em compras de vacinas (UNICEF), que costumam ser mais caras que as comerciais.",refs:[xe.cold]}},Ws={what:"O risco de falha é a <b>chance estimada de a máquina parar</b> por causa do ritmo em que ela está trabalhando. Não é uma medição: é uma estimativa didática do simulador.",zones:[["No ótimo","2%","Máquina trabalhando como foi projetada."],["Atenção (acima do ótimo)","2% a 10%","Produz um pouco mais, mas o desgaste e o aquecimento aumentam."],["Zona crítica","10% a 40%","Perto do limite: pequenas variações já podem causar parada."],["Falha","100%","Passou do limite: a máquina para e tudo depois dela fica sem produto."]],physics:["<b>Sobrecarga</b>: pedir mais do que o motor ou a bomba foram feitos para entregar.","<b>Superaquecimento</b>: mais trabalho gera mais calor; passando de certo ponto, o equipamento se danifica.","<b>Vibração e desgaste</b>: rolamentos, eixos e válvulas se desgastam mais rápido em alta velocidade.","<b>Pressão</b>: em tubulações e vasos, pressão acima do limite pode causar vazamento ou estouro."]};function Oh(){const e={};return Object.entries(Th).forEach(([a,t])=>{const r=Rh[a],s=Fh[a];e[a]={...t,...r,lifeH:Yu[t.cat],maintH:Ku[t.cat],cost:{...s,refs:[...s.refs]}}}),e}const em={bebidas:{name:"Bebidas em geral",nodes:[["tanque_agua",40,60],["tanque_xarope",270,60],["misturador",500,60],["pasteurizador",730,60],["carbonatador",730,250],["enchedora",500,250],["esteira",270,250],["rotuladora",40,250]]},suco:{name:"Suco de laranja natural",nodes:[["recepcao_fruta",40,60],["lavadora_frutas",270,60],["extratora",500,60],["filtro_despolpadeira",500,250],["envasadora_suco",270,250],["camara_fria",40,250]]}},ir=[{id:"rec",name:"Recepção e preparo",stages:["Insumos","Preparo","Extração","Filtragem"],color:"#E6F1F5"},{id:"term",name:"Tratamento térmico e gás",stages:["Tratamento térmico","Carbonatação"],color:"#FDF1E3"},{id:"env",name:"Envase e expedição",stages:["Envase","Pós-envase","Transporte"],color:"#E7F3EC"},{id:"frio",name:"Câmara fria",stages:["Refrigeração"],color:"#EAF0F8"}],fc=[["Tetra Pak Pasteurizer BF","ficha técnica","real"],["Tetra Pak In-line Blender B","ficha técnica","real"],["Krones Modulfill VFJ","catálogo do fabricante","real"],["Krones Contiroll","página do fabricante","estimado"],["Osterroth & Voigt (2021) — consumo de energia","artigo científico","real"]],Ah=["Onde está o gargalo?","Quanto custa melhorar o gargalo?","Quero aumentar a produção em 10%","O que acontece se a enchedora falhar?","Como funciona o pasteurizador?"],Ih={insumos:{name:"Insumos",icon:"truck",desc:"Onde a matéria-prima entra na fábrica (água, frutas…). Se o insumo não chega, nada do resto funciona."},preparo:{name:"Preparo",icon:"mixer",desc:"Transformam o insumo bruto no produto: lavar, espremer, filtrar, dosar o xarope e misturar com a água."},termico:{name:"Térmico e gás",icon:"pasteur",desc:"Tratam a bebida com calor (para eliminar micro-organismos e durar mais) ou colocam gás (CO₂), como no refrigerante."},envase:{name:"Envase",icon:"filler",desc:"Colocam a bebida dentro das garrafas. São máquinas delicadas e, com frequência, o gargalo da fábrica."},pos:{name:"Pós-envase",icon:"label",desc:"Depois que a garrafa está cheia: colar o rótulo e levar a garrafa de uma máquina para a outra."},frio:{name:"Refrigeração",icon:"fridge",desc:"Mantêm o produto gelado. Quando o produto não é pasteurizado, é o frio que garante a segurança."}},Lh={tanque_agua:{long:"Reservatório que guarda a água usada na bebida. Ele alimenta as máquinas seguintes numa vazão controlada.",how:"A vazão é o quanto de água sai por hora. Aumentar a vazão entrega mais água às máquinas seguintes, mas só ajuda a produção se elas conseguirem usar.",tips:"Raramente é o gargalo. Cuidado com o nível muito baixo (falta de água) ou muito alto (risco de transbordar)."},recepcao_fruta:{long:"Ponto onde as laranjas chegam à fábrica, são descarregadas e seguem para a lavagem.",how:"A taxa de recepção é quantos quilos de fruta entram por hora. Receber mais do que a lavadora e a extratora aguentam só forma fila.",tips:"Frutas de má qualidade aumentam o descarte e reduzem o rendimento de suco."},tanque_xarope:{long:"Reservatório do xarope, a mistura concentrada de açúcar e sabor que será diluída na água.",how:"A dosagem é quantos litros de xarope saem por hora. A proporção com a água define o sabor e a doçura (Brix) da bebida.",tips:"O xarope é grosso: a temperatura certa evita dosagem irregular."},misturador:{long:"Mistura a água com o xarope até a bebida ficar uniforme.",how:"A rotação (RPM) é a velocidade da pá. Girar mais rápido mistura mais rápido, mas aumenta o desgaste e a vibração.",tips:"Vibração alta é sinal de desgaste. Perto do limite de rotação, a máquina pode falhar."},lavadora_frutas:{long:"Lava e higieniza as laranjas antes de espremer, tirando terra e sujeira da casca.",how:"A vazão de lavagem é quantos quilos de fruta passam por hora. Passar rápido demais lava mal.",tips:"Lavagem ruim compromete a segurança do suco."},extratora:{long:"Espreme as laranjas e separa o suco da casca e do bagaço.",how:"A velocidade (RPM) define quantas frutas são espremidas por hora. Muito rápido reduz o rendimento e desgasta a máquina.",tips:"É a etapa que mais influencia o rendimento (litros de suco por quilo de fruta)."},filtro_despolpadeira:{long:"Retira bagaço, sementes e fiapos do suco, deixando a textura desejada.",how:"A vazão de filtragem é quantos litros passam por hora. Forçar a vazão entope o filtro.",tips:"Precisa de limpeza frequente; filtro entupido derruba a produção."},pasteurizador:{long:"Aquece a bebida por um tempo controlado para eliminar micro-organismos e aumentar a validade.",how:"A vazão é quanto líquido passa por hora. Acima do ótimo o líquido passa rápido demais pelo calor, e o tratamento pode ficar incompleto.",tips:"A temperatura precisa ficar numa faixa segura: abaixo dela o lote pode ser reprovado; acima dela aumenta o gasto de energia e o desgaste. Suco natural não passa por esta etapa."},carbonatador:{long:"Dissolve gás carbônico (CO₂) na bebida para torná-la gaseificada.",how:"A vazão é quanto líquido recebe gás por hora. Pressão de CO₂ baixa deixa a bebida sem gás; alta demais traz risco de estouro.",tips:"Só existe em bebidas com gás."},enchedora:{long:"Coloca a bebida dentro das garrafas, uma a uma, em alta velocidade.",how:"A cadência é quantas garrafas por minuto. Mais cadência produz mais, mas aumenta a vibração e o risco de falha.",tips:"Costuma ser o coração e o gargalo da linha. Mesmo parada, consome energia."},envasadora_suco:{long:"Enche as garrafas de suco natural, em escala menor e geralmente mais simples que a enchedora industrial.",how:"A cadência é quantas garrafas por minuto. Em operações pequenas ela costuma ser o gargalo.",tips:"Precisa de higiene rigorosa, já que o suco natural não é pasteurizado."},esteira:{long:"Leva as garrafas de uma máquina para a outra.",how:"A velocidade (m/s) define o ritmo do transporte. Rápida demais derruba garrafas; lenta demais forma fila.",tips:"Corrente do motor acima do limite superaquece. Raramente é o gargalo."},rotuladora:{long:"Cola o rótulo nas garrafas já cheias.",how:"A cadência é quantas garrafas por minuto recebem rótulo. Se for menor que a da enchedora, ela vira o gargalo da linha.",tips:"Mesmo parada, gasta bastante energia (consumo de espera mais alto que o das outras)."},camara_fria:{long:"Guarda o suco refrigerado até a expedição, mantendo-o seguro e fresco.",how:"A vazão de resfriamento é quantas garrafas por hora conseguem ser resfriadas. Se for menor que o envase, forma fila de garrafas quentes.",tips:"Em suco natural, o frio é o que protege o produto: a temperatura deve ficar entre 1 e 4 °C."}},Hs=[{id:"login",title:"1. Entrar",img:"01-login.jpg",what:"A porta de entrada do sistema. Basta usuário e senha.",does:["Digite o usuário e a senha e clique em Entrar.","O nome aparece no topo da tela, com o botão Sair."],tip:"Neste protótipo nenhuma senha é verificada de verdade."},{id:"montar",title:"2. Montar a fábrica",img:"02-montar.jpg",what:"O quadro onde você desenha a fábrica: cada cartão é uma máquina e cada linha mostra por onde o produto passa.",does:["Arraste máquinas da lista de baixo para o quadro (ou dê duplo clique). A lista só aparece nesta aba e pode ser escondida no botão “Esconder máquinas”.","Mova as máquinas arrastando. Use Selecionar, Conectar, Excluir e Limpar tudo na caixa Ferramentas.","Cada cartão mostra o ritmo, o que sai por hora e o consumo de energia.","Use um exemplo pronto pelo menu Exemplos."],tip:"A cor da borda mostra a situação: verde normal, laranja atenção, vermelho falha. O painel da direita também pode ser escondido pela setinha na borda."},{id:"conectar",title:"3. Conectar máquinas",img:"03-conectar.jpg",what:"Ligar uma máquina na outra. O sistema avisa quando uma ligação não faz sentido.",does:["Escolha Conectar, clique na máquina de origem e depois na de destino.","As máquinas que podem receber ficam destacadas; as outras ficam apagadas.","Se a ligação for impossível, aparece o motivo. Se for incomum, aparece um aviso.","Linha cheia = conexão direta. Linha tracejada = divisão ou junção de fluxo."],tip:"O produto só anda para a frente: insumos → preparo → tratamento → envase → rótulo."},{id:"play",title:"4. Rodar a simulação (Play)",img:"04-play.jpg",what:"Acompanhe o processo acontecendo, como no Packet Tracer, até o resultado final.",does:["Na caixa Simulação, clique em Iniciar. O produto vai caminhando pelas conexões e as máquinas começam a trabalhar uma a uma.","Pause, mude a velocidade (×1, ×5, ×20, ×60) ou pare a qualquer momento.","Mexa nas máquinas durante a simulação e veja o efeito.","O andamento (“01:30 — 17.200 garrafas produzidas…”) aparece na aba Registro, no painel da direita.","No fim, um resumo mostra produção, energia, risco e gargalo."],tip:"Os números “fila” mostram o excesso que uma máquina entrega a mais do que a seguinte aguenta."},{id:"ambiente",title:"5. Temperatura do ambiente",img:"05-ambiente.jpg",what:"Veja como o calor e o frio mudam o desempenho da fábrica.",does:["Na caixa Ambiente, digite a temperatura ou clique em Efeitos para abrir os detalhes.","Escolha uma situação pronta (Inverno, Ideal, Verão, Calor extremo) ou ajuste no controle.","Veja quanto cada máquina perde de capacidade e quanto cai a produção.","Veja a dilatação da água e em que o cálculo se baseia (com link)."],tip:"Os percentuais por grau são hipótese didática e estão marcados assim."},{id:"objetivo",title:"6. Objetivo",img:"06-objetivo.jpg",what:"Diga o que você quer e o sistema mostra o que fazer.",does:["Escolha o objetivo: aumentar a produção em %, chegar a uma meta ou reduzir o risco.","Clique em Ver o que fazer: aparece o passo a passo, com o porquê de cada passo e o antes/depois.","Se não der só ajustando, ele sugere usar mais unidades em paralelo e mostra o investimento estimado.","Aplicar na fábrica faz as mudanças valerem."],tip:"As palavras sublinhadas têm explicação: passe o mouse ou clique para abrir o glossário."},{id:"maquina",title:"7. Máquina",img:"07-maquina.jpg",what:"Os detalhes e o ajuste da máquina selecionada.",does:["Mude o ritmo digitando, com − e +, ou pelo controle deslizante.","Veja capacidade, saída real, risco e consumo.","Use unidades em paralelo, ligar/desligar e Testar falha.","Em Mais detalhes: de onde vêm os números e o preço estimado, com links."],tip:"Clique em “Risco” para entender o que pode acontecer fisicamente."},{id:"conversa",title:"8. Conversa",img:"08-conversa.jpg",what:"Um assistente que analisa a sua fábrica e consulta manuais.",does:["Pergunte onde está o gargalo, quanto custa melhorar, o que acontece se uma máquina falhar ou como funciona uma máquina.","Peça “quero aumentar 10%” e aplique o plano com um clique.","As respostas mostram a fonte consultada."],tip:"No protótipo a leitura dos manuais é de exemplo."},{id:"painel",title:"9. Painel da máquina",img:"09-painel.jpg",what:"A tela de configuração de uma máquina, como o operador vê na fábrica.",does:["Escolha a máquina na faixa do processo.","Ajuste o ritmo com os botões grandes ▲▼ ou use uma receita: Econômico, Padrão ou Máximo seguro.","Ligue ou desligue a máquina e mude as unidades em paralelo.","O botão vermelho simula a parada de emergência."],tip:"Boa tela para apresentar como uma máquina é configurada."},{id:"fisica",title:"10. Fábrica vista de cima",img:"10-fisica.jpg",what:"A planta baixa: onde cada máquina fica no chão da fábrica.",does:["Cada máquina aparece na sua área (recepção, térmico, envase, frio).","Ligue “Por onde o produto passa” e “Quem gasta mais energia”."],tip:"No fluxo do suco natural a área térmica fica vazia: não há pasteurização."},{id:"resultados",title:"11. Resultados e avisos",img:"11-resultados.jpg",what:"Os números da fábrica, explicados, e o porquê do gargalo.",does:["Produção, eficiência, risco e energia (em @page { size: A4; margin: 14mm 12mm; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: Segoe UI, Arial, sans-serif; color: #17232E; font-size: 11.5px; line-height: 1.4; margin: 0; }
h1 { font-size: 21px; margin: 0 0 2px; } h2 { font-size: 15px; margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 2px solid #1C7293; color: #17232E; }
h3 { font-size: 12.5px; margin: 12px 0 4px; } .sub { color: #66757F; font-size: 10.5px; margin: 2px 0 6px; }
.head { border-bottom: 3px solid #17232E; padding-bottom: 6px; margin-bottom: 8px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.kpi { border: 1px solid #DCE3E8; border-radius: 8px; padding: 8px 10px; } .kpi small { color: #66757F; text-transform: uppercase; font-size: 9px; letter-spacing: .04em; display: block; }
.kpi b { font-size: 19px; display: block; } .kpi em { font-style: normal; color: #66757F; font-size: 10px; }
table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; } th, td { border-bottom: 1px solid #E5EBEF; padding: 4px 6px; text-align: left; vertical-align: top; }
th { font-size: 9.5px; text-transform: uppercase; color: #66757F; letter-spacing: .03em; background: #F5F8FA; } td.n, th.n { text-align: right; white-space: nowrap; }
.ok { color: #2E8B57; font-weight: 700; } .bad { color: #C0392B; font-weight: 700; } .warn { color: #E8871E; font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .box { break-inside: avoid; page-break-inside: avoid; margin-bottom: 8px; }
