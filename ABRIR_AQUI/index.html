 da fábrica envasa até 50 mil garrafas por hora (investimento de cerca de R$ 191 milhões) e quase dobrou a capacidade em vidro retornável.","A fábrica produz mais de 2 bilhões de litros de bebidas por ano, tem 17 linhas de envase e responde por 31% da produção nacional da marca.","Inaugurada em 1993; operada pela Coca-Cola FEMSA Brasil desde 2003."],assumptions:[Ga,"A lavagem das garrafas retornáveis e a inspeção eletrônica existem na linha real, mas não há essas máquinas no catálogo: ficam de fora.","A fábrica toda tem 17 linhas; este mapa é só a linha 17."],history:["A FEMSA (México) tem origem em Monterrey. A Coca-Cola FEMSA concluiu a compra da Panamco em maio de 2003 e é considerada a maior engarrafadora da Coca-Cola da América Latina.","No Brasil, a fábrica de Jundiaí foi inaugurada em 1993 e opera sob a Coca-Cola FEMSA desde 2003. Entre 2024 e 2026 recebe mais de R$ 360 milhões em modernização e expansão."],sources:[{t:"Tribuna de Jundiaí: investimento e a 17ª linha (50 mil garrafas/h)",u:"https://tribunadejundiai.com.br/cidades/jundiai/coca-cola-femsa-jundiai-investimento/"},{t:"Coca-Cola FEMSA: compra da Panamco (resultados 2003)",u:"https://femsa.gcs-web.com/node/9486"}],nodes:ta([["tanque_agua",4],["tanque_xarope",4],["misturador",4],["pasteurizador",5],["carbonatador",4],["enchedora",5,166.7],["esteira",4],["rotuladora",5]])},{key:"slmg_chhata",name:"SLMG Beverages · Chhata (linha PET KHS)",company:"SLMG Beverages (engarrafadora da Coca-Cola)",place:"Chhata (Uttar Pradesh), Índia",what:"Refrigerantes Coca-Cola em garrafas PET de 250 ml a 2 L.",ratedBph:48e3,price:da.pet1,facts:["A linha KHS InnoPET TriBlock (sopradora, enchedora e rotuladora num bloco só) processa até 48 mil garrafas PET por hora.","A nova linha elevou a capacidade PET da fábrica em cerca de 35% e responde por cerca de 60% das bebidas produzidas; a fábrica tem seis linhas.","Instalação em cerca de 40 dias, da entrega dos equipamentos à primeira garrafa validada."],assumptions:[Ga,"O sopro das garrafas PET e as máquinas que aplicam a camada de vidro interna (Plasmax) não existem no catálogo: ficam de fora."],history:["A SLMG Beverages reúne engarrafadoras da Coca-Cola dos irmãos da família Ladhani em Uttar Pradesh (o nome vem das iniciais dos quatro irmãos) e é descrita como a maior engarrafadora da Coca-Cola na Índia.","A trajetória da família no engarrafamento vem das décadas de 1980 e 1990; o fundador, S. N. Ladhani, morreu em 2025 (relatos de imprensa; a estrutura atual de quatro engarrafadoras é de cerca de 2019)."],sources:[{t:"Food Processing: SLMG amplia a capacidade com a linha KHS (48 mil/h)",u:"https://www.foodprocessing.com.au/content/packaging-labelling-coding/case-study/coca-cola-bottler-in-india-boosts-capacity-for-high-season-542575821"},{t:'KHS: SLMG Beverages, "right on time"',u:"https://www.khs.com/en/company/news/press-releases/detail/khs-and-slmg-beverages-right-on-time"},{t:"Outlook India: S. N. Ladhani e a SLMG",u:"https://www.outlookindia.com/outlook-spotlight/s-n-ladhani-india-s-largest-independent-coca-cola-bottler-and-champion-of-nature-conservation-news-310736"}],nodes:ta([["tanque_agua",4],["tanque_xarope",4],["misturador",4],["pasteurizador",4],["carbonatador",4],["enchedora",4,200],["esteira",4],["rotuladora",5]])},{key:"refres_now_manaos",name:"Refres Now (Manaos) · La Matanza (Combi 2,5 L)",company:"Refres Now (refrigerante Manaos)",place:"La Matanza (Buenos Aires), Argentina",what:"Refrigerantes em garrafas PET de 2,5 litros (embalagem família).",ratedBph:3e4,price:da.pet2regional,facts:["A linha Sidel Combi (sopradora, enchedora e tampadora) entrega 30 mil garrafas de 2,5 L por hora.","O Combi tem 20 estações de sopro, 162 válvulas de enchimento e 18 cabeçotes de tampagem; um misturador Sidel Starblend prepara a bebida. A troca reduziu o consumo de eletricidade da linha em 17%.","Em 2017 a Sidel anunciou nova ampliação, de cerca de 40% da produção da fábrica."],assumptions:[Ga,"Os 30 mil/h são de 2014 (antes da ampliação de 2017). Sopro e tampagem não existem no catálogo: ficam de fora."],history:["A Refres Now é a dona da gasosa Manaos. Foi fundada em 2004 por Orlando Canido e a fábrica fica em Virrey del Pino, La Matanza. A família juntou cerca de US$ 200 mil para comprar o terreno; antes distribuía a gasosa Sao.","A imprensa argentina fala em cerca de 15 linhas e 600 funcionários. Em 2025 a empresa comprou a Prodea (marcas Cunnington e Neuss) por cerca de US$ 70 a 74 milhões."],sources:[{t:"Sidel: Refres Now e o Combi para refrigerantes (30 mil/h)",u:"https://www.sidel.com/about/media/press-releases/refres-now-argentina/"},{t:"Sidel: ampliação de 40% (2017)",u:"https://www.packagingconnections.com/v3/pressrelease/refres-now-increase-production-capacity-40-while-halving-energy-consumption-choosing"},{t:"La Nación: os segredos da Manaos",u:"https://www.lanacion.com.ar/economia/expedientes-manaos-los-secretos-de-la-gaseosa-mas-popular-del-conurbano-nid1938760/"},{t:"Bloomberg Línea: compra da Prodea",u:"https://www.bloomberglinea.com/latinoamerica/argentina/manaos-cerro-la-compra-de-cunnington-y-neuss-por-us74-millones/"}],nodes:ta([["tanque_agua",2],["tanque_xarope",3],["misturador",3],["pasteurizador",3],["carbonatador",3],["enchedora",3,166.7],["esteira",3],["rotuladora",3]])},{key:"coca_cola_canners",name:"Coca-Cola Canners · Wadeville (hot-fill KHS)",company:"Coca-Cola Canners (África do Sul)",place:"Wadeville (Joanesburgo), África do Sul",what:"Chás gelados, isotônicos e sucos (com e sem pedaços de fruta) em PET de 0,3 a 1,5 L, com enchimento a quente.",ratedBph:48e3,price:da.iso,facts:["A linha KHS (sopro, enchimento, rotulagem e embalagem) enche até 48 mil garrafas por hora.","Hot-fill: o produto é aquecido acima de 100 °C e envasado a cerca de 83 °C. Há duas enchedoras volumétricas de precisão (uma para os pedaços de fruta, outra para completar com suco) e até 20 bebidas em 8 formatos na mesma linha.","A unidade de Wadeville tem quatro linhas de latas e duas de PET, com cerca de 320 pessoas (ficha do fornecedor SMI)."],assumptions:[Ga,"No hot-fill não há carbonatação: a cadeia não tem carbonatador, e o pasteurizador representa o aquecimento a quente.","Os 48 mil/h são da matéria de 2016."],history:["Coca-Cola Canners é a unidade de produção de Wadeville, perto de Joanesburgo; envasa Coca-Cola, Sprite, Fanta, Powerade e Glacéau.","Não encontramos fonte confiável sobre a data de fundação nem sobre a estrutura societária, por isso não afirmamos nada sobre isso."],sources:[{t:"Food Processing: hot-fill higiênico na Coca-Cola Canners (48 mil/h)",u:"https://foodprocessing.com.au/content/packaging-labelling-coding/case-study/hygienic-bottling-using-hot-fill-technology-334440742"},{t:"KHS: Coca-Cola usa sistema hot-fill sob medida",u:"https://www.khs.com/en/company/news/press-releases/detail/coca-cola-uses-customized-hot-fill-system-from-khs"},{t:"SMI: ficha da Coca-Cola Canners (linhas e pessoas)",u:"https://www.smigroup.it/repository-new/doc/COCA%20CANNERS_EN.pdf"}],nodes:ta([["tanque_agua",4],["tanque_xarope",4],["misturador",4],["pasteurizador",4],["enchedora",4,200],["esteira",4],["rotuladora",5]])},{key:"quilmes_gatorade",name:"Quilmes · Buenos Aires Sul (Gatorade, depois da ampliação)",company:"Cervecería y Maltería Quilmes",place:"Buenos Aires (planta Sul), Argentina",what:"Gatorade e outras bebidas não alcoólicas em PET de 300 a 1200 ml, com enchimento a quente (hot-fill).",ratedBph:45e3,price:da.iso,facts:["Em 2020 a linha PET passou de 22 mil para 45 mil garrafas por hora, com a primeira sopradora-enchedora Sidel Combi da planta.","Com a garrafa de 500 ml a linha opera a cerca de 95% de eficiência média, com picos de 100%.","A pasteurização é de um pasteurizador Tetra Pak; a recuperação de calor do resfriador economiza de 10% a 15% do calor."],assumptions:[Ga,"No hot-fill não há carbonatação: a cadeia não tem carbonatador. O sopro, o resfriador e a paletização não existem no catálogo."],history:["A Quilmes é a maior empresa de bebidas da Argentina (segundo a Sidel). A cervejaria foi fundada em 1888 por Otto Bemberg, com produção desde 1890, e hoje faz parte do grupo AB InBev.","Além de cerveja, a planta envasa bebidas não alcoólicas como o Gatorade (as fontes encontradas não detalham a relação comercial com a marca)."],sources:[{t:"Sidel: linha hot-fill da Quilmes (22 mil para 45 mil/h)",u:"https://www.sidel.com/about/media/press-releases/quilmes-argentina/"},{t:"El Cronista: história da Quilmes",u:"https://www.cronista.com/apertura/empresas/la-empresa-que-paso-de-ser-expropiada-por-peron-a-conquistar-el-mundo-empresario-con-la-bandera-argentina"},{t:"Mercado: o que você não sabia sobre a Quilmes",u:"https://mercado.com.ar/marketing/lo-que-no-sabias-sobre-quilmes"}],nodes:ta([["tanque_agua",3],["tanque_xarope",4],["misturador",4],["pasteurizador",4],["enchedora",4,187.5],["esteira",4],["rotuladora",5]])},{key:"quilmes_gatorade_antes",name:"Quilmes · Gatorade ANTES da ampliação (22 mil/h)",company:"Cervecería y Maltería Quilmes",place:"Buenos Aires (planta Sul), Argentina",what:"A mesma linha antes da ampliação de 2020. Use para repetir a ampliação real no simulador: aplique a melhoria, rode o Play e compare a V1 com a V2.",ratedBph:22e3,price:da.iso,facts:['Antes de 2020 a linha PET de hot-fill enchia 22 mil garrafas por hora; depois da ampliação, 45 mil (ver o mapa "depois da ampliação").',"A ampliação dobrou a capacidade de PET da planta: no simulador, é aproximadamente dobrar as unidades de cada máquina."],assumptions:[Ga,'Quantidades escalonadas na mesma proporção do mapa "depois da ampliação".'],history:['Ver o mapa "Quilmes · depois da ampliação".'],sources:[{t:"Sidel: linha hot-fill da Quilmes (22 mil para 45 mil/h)",u:"https://www.sidel.com/about/media/press-releases/quilmes-argentina/"}],nodes:ta([["tanque_agua",2],["tanque_xarope",2],["misturador",2],["pasteurizador",2],["enchedora",2,183.3],["esteira",2],["rotuladora",3]])},{key:"refriko_sjp",name:"Refriko (Grupo RFK) · São José dos Pinhais (linha de refrigerantes)",company:"Refriko (Grupo RFK)",place:"São José dos Pinhais (PR), Brasil",what:"Refrigerantes (a fábrica também faz cerveja em lata, energéticos e água, que ficam de fora deste mapa).",ratedBph:33e3,price:da.pet2regional,facts:["A fábrica nova tem uma linha de refrigerantes de 33 mil garrafas por hora e uma linha de cerveja de 60 mil latas por hora.","Capacidade inicial de 2,3 milhões de bebidas por dia, com meta de chegar a 10 milhões por dia nos próximos anos.","Investimento de R$ 400 milhões, em um terreno de 300 mil m², com 24 meses de obra. Meta de receita de R$ 2 bilhões em 2029.","O Grupo RFK tem quatro fábricas em operação, 115 produtos e 12 marcas ativas; refrigerantes respondem por cerca de 40% da receita e energéticos por 30%."],assumptions:[Ga,"A matéria não diz se a garrafa é PET nem o tamanho: para o preço usamos o PET de 2 L de marcas regionais.","A linha de latas de cerveja (60 mil/h), os energéticos e a água (que é engarrafada perto da fonte, em outra unidade) ficam de fora."],history:["A Refriko faz parte do Grupo RFK (diretor-executivo Márcio Mendes). A matéria não informa a data de fundação.","A fábrica de São José dos Pinhais fica na região metropolitana de Curitiba; a matéria é de julho de 2026 e traz o plano de levar guaraná, energéticos e água mineral para a China."],sources:[{t:"Gazeta do Povo: Refriko mira 10 milhões de bebidas por dia com nova fábrica no Paraná (jul/2026)",u:"https://www.gazetadopovo.com.br/parana/refriko-mira-producao-de-10-milhoes-de-bebidas-por-dia-com-nova-fabrica-no-parana/"}],nodes:ta([["tanque_agua",3],["tanque_xarope",3],["misturador",3],["pasteurizador",3],["carbonatador",3],["enchedora",3,183.3],["esteira",3],["rotuladora",4]])},{key:"tial_antes",name:"Tial · suco pronto ANTES da nova linha (11 mil L/h)",company:"Tial (sucos prontos)",place:"Visconde do Rio Branco (MG), Brasil",what:"Suco pronto para beber, feito de concentrado e água. Este mapa é a fábrica ANTES da nova linha de pasteurização: duas linhas de processamento que somam 11 mil litros por hora.",ratedBph:11e3,bottleneck:"pasteurizador",price:da.nectar1,revenueRef:{brl:35e7,year:2024,text:"Receita de R$ 350 milhões em 2024 (Exame)."},facts:["Antes da modernização, as duas linhas de processamento da fábrica somavam 11 mil litros por hora.","A Tial teve receita de R$ 350 milhões em 2024 e liderava o mercado regional de suco pronto em Minas Gerais, com 19% de participação (quase o dobro da segunda colocada)."],assumptions:[Cc,"O dado publicado é de processamento em litros por hora: assumimos garrafa de 1 L (1 L = 1 garrafa) para caber no simulador. Por isso o gargalo deste mapa é o pasteurizador, e não a enchedora.","A matéria descreve suco feito de água e concentrado: a cadeia tem tanque de concentrado e misturador, e não tem carbonatador."],history:['Use junto com o mapa "depois da nova linha": a diferença entre os dois é a melhoria real que a empresa fez.'],sources:[{t:"Exame (conteúdo patrocinado pela Tetra Pak): a tecnologia da Tetra Pak na Tial",u:"https://exame.com/negocios/tecnologia-tetra-pak/"}],nodes:ta([["tanque_agua",1],["tanque_xarope",1],["misturador",1],["pasteurizador",1,5.5],["enchedora",1],["esteira",1],["rotuladora",2]])},{key:"tial",name:"Tial · suco pronto DEPOIS da nova linha (37 mil L/h)",company:"Tial (sucos prontos)",place:"Visconde do Rio Branco (MG), Brasil",what:"A mesma fábrica depois da nova linha de pasteurização, que pode chegar a 37 mil litros por hora e substitui as duas linhas antigas.",ratedBph:37e3,bottleneck:"pasteurizador",price:da.nectar1,revenueRef:{brl:35e7,year:2024,text:"Receita de R$ 350 milhões em 2024 (Exame)."},facts:["A nova linha de pasteurização da Tetra Pak (a água é purificada por radiação ultravioleta e filtração, e o concentrado é pasteurizado separadamente, antes da mistura) pode chegar a 37 mil litros por hora.","Resultados informados: consumo de vapor 64,6% menor, uso de água 50% menor, perdas de produto no envase 92% menores e economia de 190 mil litros de concentrado por ano.","O investimento inicial é cerca de 10% maior que o de um sistema convencional e o retorno esperado é em menos de um ano, pela economia de energia e insumos."],assumptions:[Cc,"Garrafa de 1 L assumida (1 L = 1 garrafa). O gargalo é o pasteurizador, como na matéria.","A economia de vapor, de água e de perdas aparece na matéria, mas o simulador só calcula capacidade, risco e energia elétrica: esses ganhos NÃO entram no cálculo em reais daqui.","A matéria é conteúdo patrocinado pelo fornecedor (Tetra Pak) e os números não foram verificados de forma independente."],history:["A matéria não conta a fundação da empresa. Ela aparece como fabricante de sucos prontos de Minas Gerais, líder regional, e a modernização é apresentada como parte de um plano de ampliação da fábrica (até 67% numa primeira fase)."],sources:[{t:"Exame (conteúdo patrocinado pela Tetra Pak): a tecnologia da Tetra Pak na Tial",u:"https://exame.com/negocios/tecnologia-tetra-pak/"}],nodes:ta([["tanque_agua",3],["tanque_xarope",3],["misturador",3],["pasteurizador",3,6.2],["enchedora",4],["esteira",3],["rotuladora",4]])},{key:"tannourine",name:"Tannourine Water · linha Sidel (água mineral)",company:"Société Libanaise des Sources des Eaux de Tannourine",place:"Tannourine, Líbano",what:"Água mineral natural em garrafas PET.",ratedBph:31500,facts:["A nova linha Sidel Matrix Combi, anunciada em 2014, tem capacidade de 31.500 garrafas por hora.","A empresa vendia cerca de 150 milhões de litros de água por ano (Líbano, Oriente Médio, África Ocidental e Austrália).","Em 2023 a própria empresa declarou capacidade de 90 mil garrafas/h na fábrica (não sabemos se soma outras linhas)."],assumptions:["Água mineral natural não leva xarope, mistura, pasteurização nem gás: a cadeia é só água, enchedora, esteira e rotuladora. Quantidades calculadas para sustentar 31.500/h.",'O tratamento da água e o sopro das garrafas não existem no catálogo: ficam de fora. O sistema avisa que a ligação "pula etapas" do processo se você refizer a conexão à mão.'],history:["A empresa é de 1978 e envasa água mineral da nascente na região de Tannourine, nas montanhas do Líbano (cerca de 1.250 m de altitude, segundo uma fonte).","Em outubro de 2025 o Ministério da Saúde libanês suspendeu a produção por suspeita de contaminação; a empresa contestou e voltou a produzir. O episódio é contestado nas fontes."],sources:[{t:"FoodNavigator: Tannourine amplia a produção com linha Sidel (31.500/h)",u:"https://www.foodnavigator.com/Article/2015/01/12/Tannourine-Water-boosts-production-with-Sidel-bottling-line/"},{t:"Sidel: Tannourine, Líbano",u:"https://www.sidel.com/about/media/press-releases/tannourine-lebanon/"},{t:"Missão econômica (Francofonia): ficha da empresa",u:"https://missions-economiques.francophonie.org/mission-economique-2023-liban/en/partner/f06967b8-d856-ee11-9937-000d3a4cc0c5/societe-libanaise-des-sources-des-eaux-de-tannourine"}],nodes:ta([["tanque_agua",3],["enchedora",3,175],["esteira",3],["rotuladora",3]])}],It=Object.fromEntries(nl.map(e=>[e.key,e])),gm={bebidas:{name:"Bebidas em geral",nodes:[["tanque_agua",40,60],["tanque_xarope",270,60],["misturador",500,60],["pasteurizador",730,60],["carbonatador",730,250],["enchedora",500,250],["esteira",270,250],["rotuladora",40,250]]},suco:{name:"Suco de laranja natural",nodes:[["recepcao_fruta",40,60],["lavadora_frutas",270,60],["extratora",500,60],["filtro_despolpadeira",500,250],["envasadora_suco",270,250],["camara_fria",40,250]]},...Object.fromEntries(nl.map(e=>[e.key,{name:e.name,nodes:e.nodes}]))},gr=[{id:"rec",name:"Recepção e preparo",stages:["Insumos","Preparo","Extração","Filtragem"],color:"#E6F1F5"},{id:"term",name:"Tratamento térmico e gás",stages:["Tratamento térmico","Carbonatação"],color:"#FDF1E3"},{id:"env",name:"Envase e expedição",stages:["Envase","Pós-envase","Transporte"],color:"#E7F3EC"},{id:"frio",name:"Câmara fria",stages:["Refrigeração"],color:"#EAF0F8"}],qc=[["Tetra Pak Pasteurizer BF","ficha técnica","real"],["Tetra Pak In-line Blender B","ficha técnica","real"],["Krones Modulfill VFJ","catálogo do fabricante","real"],["Krones Contiroll","página do fabricante","estimado"],["Osterroth & Voigt (2021) — consumo de energia","artigo científico","real"]],sg=["Onde está o gargalo?","Quanto custa melhorar o gargalo?","Quero aumentar a produção em 10%","O que acontece se a enchedora falhar?","Como funciona o pasteurizador?"],og={insumos:{name:"Insumos",icon:"truck",desc:"Onde a matéria-prima entra na fábrica (água, frutas…). Se o insumo não chega, nada do resto funciona."},preparo:{name:"Preparo",icon:"mixer",desc:"Transformam o insumo bruto no produto: lavar, espremer, filtrar, dosar o xarope e misturar com a água."},termico:{name:"Térmico e gás",icon:"pasteur",desc:"Tratam a bebida com calor (para eliminar micro-organismos e durar mais) ou colocam gás (CO₂), como no refrigerante."},envase:{name:"Envase",icon:"filler",desc:"Colocam a bebida dentro das garrafas. São máquinas delicadas e, com frequência, o gargalo da fábrica."},pos:{name:"Pós-envase",icon:"label",desc:"Depois que a garrafa está cheia: colar o rótulo e levar a garrafa de uma máquina para a outra."},frio:{name:"Refrigeração",icon:"fridge",desc:"Mantêm o produto gelado. Quando o produto não é pasteurizado, é o frio que garante a segurança."}},ig={tanque_agua:{long:"Reservatório que guarda a água usada na bebida. Ele alimenta as máquinas seguintes numa vazão controlada.",how:"A vazão é o quanto de água sai por hora. Aumentar a vazão entrega mais água às máquinas seguintes, mas só ajuda a produção se elas conseguirem usar.",tips:"Raramente é o gargalo. Cuidado com o nível muito baixo (falta de água) ou muito alto (risco de transbordar)."},recepcao_fruta:{long:"Ponto onde as laranjas chegam à fábrica, são descarregadas e seguem para a lavagem.",how:"A taxa de recepção é quantos quilos de fruta entram por hora. Receber mais do que a lavadora e a extratora aguentam só forma fila.",tips:"Frutas de má qualidade aumentam o descarte e reduzem o rendimento de suco."},tanque_xarope:{long:"Reservatório do xarope, a mistura concentrada de açúcar e sabor que será diluída na água.",how:"A dosagem é quantos litros de xarope saem por hora. A proporção com a água define o sabor e a doçura (Brix) da bebida.",tips:"O xarope é grosso: a temperatura certa evita dosagem irregular."},misturador:{long:"Mistura a água com o xarope até a bebida ficar uniforme.",how:"A rotação (RPM) é a velocidade da pá. Girar mais rápido mistura mais rápido, mas aumenta o desgaste e a vibração.",tips:"Vibração alta é sinal de desgaste. Perto do limite de rotação, a máquina pode falhar."},lavadora_frutas:{long:"Lava e higieniza as laranjas antes de espremer, tirando terra e sujeira da casca.",how:"A vazão de lavagem é quantos quilos de fruta passam por hora. Passar rápido demais lava mal.",tips:"Lavagem ruim compromete a segurança do suco."},extratora:{long:"Espreme as laranjas e separa o suco da casca e do bagaço.",how:"A velocidade (RPM) define quantas frutas são espremidas por hora. Muito rápido reduz o rendimento e desgasta a máquina.",tips:"É a etapa que mais influencia o rendimento (litros de suco por quilo de fruta)."},filtro_despolpadeira:{long:"Retira bagaço, sementes e fiapos do suco, deixando a textura desejada.",how:"A vazão de filtragem é quantos litros passam por hora. Forçar a vazão entope o filtro.",tips:"Precisa de limpeza frequente; filtro entupido derruba a produção."},pasteurizador:{long:"Aquece a bebida por um tempo controlado para eliminar micro-organismos e aumentar a validade.",how:"A vazão é quanto líquido passa por hora. Acima do ótimo o líquido passa rápido demais pelo calor, e o tratamento pode ficar incompleto.",tips:"A temperatura precisa ficar numa faixa segura: abaixo dela o lote pode ser reprovado; acima dela aumenta o gasto de energia e o desgaste. Suco natural não passa por esta etapa."},carbonatador:{long:"Dissolve gás carbônico (CO₂) na bebida para torná-la gaseificada.",how:"A vazão é quanto líquido recebe gás por hora. Pressão de CO₂ baixa deixa a bebida sem gás; alta demais traz risco de estouro.",tips:"Só existe em bebidas com gás."},enchedora:{long:"Coloca a bebida dentro das garrafas, uma a uma, em alta velocidade.",how:"A cadência é quantas garrafas por minuto. Mais cadência produz mais, mas aumenta a vibração e o risco de falha.",tips:"Costuma ser o coração e o gargalo da linha. Mesmo parada, consome energia."},envasadora_suco:{long:"Enche as garrafas de suco natural, em escala menor e geralmente mais simples que a enchedora industrial.",how:"A cadência é quantas garrafas por minuto. Em operações pequenas ela costuma ser o gargalo.",tips:"Precisa de higiene rigorosa, já que o suco natural não é pasteurizado."},esteira:{long:"Leva as garrafas de uma máquina para a outra.",how:"A velocidade (m/s) define o ritmo do transporte. Rápida demais derruba garrafas; lenta demais forma fila.",tips:"Corrente do motor acima do limite superaquece. Raramente é o gargalo."},rotuladora:{long:"Cola o rótulo nas garrafas já cheias.",how:"A cadência é quantas garrafas por minuto recebem rótulo. Se for menor que a da enchedora, ela vira o gargalo da linha.",tips:"Mesmo parada, gasta bastante energia (consumo de espera mais alto que o das outras)."},camara_fria:{long:"Guarda o suco refrigerado até a expedição, mantendo-o seguro e fresco.",how:"A vazão de resfriamento é quantas garrafas por hora conseguem ser resfriadas. Se for menor que o envase, forma fila de garrafas quentes.",tips:"Em suco natural, o frio é o que protege o produto: a temperatura deve ficar entre 1 e 4 °C."}},to=[{id:"login",title:"1. Entrar",img:"01-login.jpg",what:"A porta de entrada do sistema. Basta usuário e senha.",does:["Digite o usuário e a senha e clique em Entrar.","O nome aparece no topo da tela, com o botão Sair."],tip:"Neste protótipo nenhuma senha é verificada de verdade."},{id:"montar",title:"2. Montar a fábrica",img:"02-montar.jpg",what:"O quadro onde você desenha a fábrica: cada cartão é uma máquina e cada linha mostra por onde o produto passa.",does:["Arraste máquinas da lista de baixo para o quadro (ou dê duplo clique). A lista só aparece nesta aba e pode ser escondida no botão “Esconder máquinas”.","Mova as máquinas arrastando. Use Selecionar, Conectar, Excluir e Limpar tudo na caixa Ferramentas.","Cada cartão mostra o ritmo, o que sai por hora e o consumo de energia.","Use um exemplo pronto pelo menu Exemplos."],tip:"A cor da borda mostra a situação: verde normal, laranja atenção, vermelho falha. O painel da direita também pode ser escondido pela setinha na borda."},{id:"conectar",title:"3. Conectar máquinas",img:"03-conectar.jpg",what:"Ligar uma máquina na outra. O sistema avisa quando uma ligação não faz sentido.",does:["Escolha Conectar, clique na máquina de origem e depois na de destino.","As máquinas que podem receber ficam destacadas; as outras ficam apagadas.","Se a ligação for impossível, aparece o motivo. Se for incomum, aparece um aviso.","Linha cheia = conexão direta. Linha tracejada = divisão ou junção de fluxo."],tip:"O produto só anda para a frente: insumos → preparo → tratamento → envase → rótulo."},{id:"play",title:"4. Rodar a simulação (Play)",img:"04-play.jpg",what:"Acompanhe o processo acontecendo, como no Packet Tracer, até o resultado final.",does:["Na caixa Simulação, clique em Iniciar. O produto vai caminhando pelas conexões e as máquinas começam a trabalhar uma a uma.","Pause, mude a velocidade (×1, ×5, ×20, ×60) ou pare a qualquer momento.","Mexa nas máquinas durante a simulação e veja o efeito.","O andamento (“01:30 — 17.200 garrafas produzidas…”) aparece na aba Registro, no painel da direita.","No fim, um resumo mostra produção, energia, risco e gargalo."],tip:"Os números “fila” mostram o excesso que uma máquina entrega a mais do que a seguinte aguenta."},{id:"ambiente",title:"5. Temperatura do ambiente",img:"05-ambiente.jpg",what:"Veja como o calor e o frio mudam o desempenho da fábrica.",does:["Na caixa Ambiente, digite a temperatura ou clique em Efeitos para abrir os detalhes.","Escolha uma situação pronta (Inverno, Ideal, Verão, Calor extremo) ou ajuste no controle.","Veja quanto cada máquina perde de capacidade e quanto cai a produção.","Veja a dilatação da água e em que o cálculo se baseia (com link)."],tip:"Os percentuais por grau são hipótese didática e estão marcados assim."},{id:"objetivo",title:"6. Objetivo",img:"06-objetivo.jpg",what:"Diga o que você quer e o sistema mostra o que fazer.",does:["Escolha o objetivo: aumentar a produção em %, chegar a uma meta ou reduzir o risco.","Clique em Ver o que fazer: aparece o passo a passo, com o porquê de cada passo e o antes/depois.","Se não der só ajustando, ele sugere usar mais unidades em paralelo e mostra o investimento estimado.","Aplicar na fábrica faz as mudanças valerem."],tip:"As palavras sublinhadas têm explicação: passe o mouse ou clique para abrir o glossário."},{id:"maquina",title:"7. Máquina",img:"07-maquina.jpg",what:"Os detalhes e o ajuste da máquina selecionada.",does:["Mude o ritmo digitando, com − e +, ou pelo controle deslizante.","Veja capacidade, saída real, risco e consumo.","Use unidades em paralelo, ligar/desligar e Testar falha.","Em Mais detalhes: de onde vêm os números e o preço estimado, com links."],tip:"Clique em “Risco” para entender o que pode acontecer fisicamente."},{id:"conversa",title:"8. Conversa",img:"08-conversa.jpg",what:"Um assistente que analisa a sua fábrica e consulta manuais.",does:["Pergunte onde está o gargalo, quanto custa melhorar, o que acontece se uma máquina falhar ou como funciona uma máquina.","Peça “quero aumentar 10%” e aplique o plano com um clique.","As respostas mostram a fonte consultada."],tip:"No protótipo a leitura dos manuais é de exemplo."},{id:"painel",title:"9. Painel da máquina",img:"09-painel.jpg",what:"A tela de configuração de uma máquina, como o operador vê na fábrica.",does:["Escolha a máquina na faixa do processo.","Ajuste o ritmo com os botões grandes ▲▼ ou use uma receita: Econômico, Padrão ou Máximo seguro.","Ligue ou desligue a máquina e mude as unidades em paralelo.","O botão vermelho simula a parada de emergência."],tip:"Boa tela para apresentar como uma máquina é configurada."},{id:"fisica",title:"10. Fábrica vista de cima",img:"10-fisica.jpg",what:"A planta baixa: onde cada máquina fica no chão da fábrica.",does:["Cada máquina aparece na sua área (recepção, térmico, envase, frio).","Ligue “Por onde o produto passa” e “Quem gasta mais energia”."],tip:"No fluxo do suco natural a área térmica fica vazia: não há pasteurização."},{id:"resultados",title:"11. Resultados e avisos",img:"11-resultados.jpg",what:"Os números da fábrica, explicados, e o porquê do gargalo.",does:["Produção, eficiência, risco e energia (em kW e em reais).","Em Avisos: por que existe um gargalo, como melhorar e quanto custa. Botão “Explorar no chat” leva a conversa já orientada.","Em “Simular uma melhoria”: teste colocar 1, 2 ou mais máquinas e veja se outra máquina vira o gargalo; o plano completo recalcula tudo em cascata, com o custo.","Capacidade e saída de cada máquina, com a fila de excesso. A mais curta é o gargalo.","Antes e depois: marque um ponto de partida e compare."],tip:"A eficiência compara a produção com o máximo que a fábrica faria no ótimo."},{id:"simular",title:"12. Simular uma melhoria",img:"12-simular.jpg",what:"Teste uma melhoria antes de comprar: o sistema recalcula tudo e mostra se outra máquina vira o gargalo.",does:["Em Resultados › Avisos, role até “Simular uma melhoria”.","Escolha quantas máquinas a mais colocar no gargalo e clique em Simular: veja produção, risco e custo estimado.","Se outra máquina passar a limitar, aparece o plano completo em cascata (o que mais precisa mudar) com o investimento total.","Ou digite uma meta (+% de produção) e clique em Calcular o plano completo. Aplicar faz valer na fábrica."],tip:"Às vezes de nada adianta tirar um gargalo se o próximo, logo atrás, é igual de lento: o plano em cascata mostra isso."},{id:"ajuda",title:"13. Ajuda: manual e glossário",img:"13-manual.jpg",what:"Tudo o que é manual está no menu Ajuda: guia da plataforma, manual das máquinas e glossário.",does:["Escolha um tipo de máquina e depois a máquina: o que faz, como o ritmo funciona, limites, risco físico, ambiente ideal e preço estimado.","Veja a imagem da tela de configuração e as fontes, com links.","Adicione a máquina à sua fábrica com um clique.","No Glossário, busque qualquer palavra difícil (gargalo, ritmo, zona crítica…)."],tip:"Hipóteses trazem uma nota dizendo em que se baseiam; fontes reais têm link. Em Opções › Configurações dá para ligar/desligar tipos de máquina e ajustar limites e preços."}],b=(e,a=0)=>Number(e??0).toLocaleString("pt-BR",{minimumFractionDigits:a,maximumFractionDigits:a}),A=e=>Number(e).toLocaleString("pt-BR",{maximumFractionDigits:2}),jn=e=>String(e).padStart(2,"0"),ts=e=>`${jn(Math.floor(e/60))}:${jn(Math.floor(e%60))}`,vm=e=>{const a=(e.max-e.min)/100;return a>=10?10:a>=1?1:a>=.5?.5:a>=.1?.1:.05},On=e=>e>=1e6?"R$ "+b(e/1e6,1)+" mi":"R$ "+b(Math.round(e/1e3))+" mil",ye=e=>e&&e.max?`${On(e.min)} a ${On(e.max)}`:"consultar o fabricante",Ln=(e,a=1)=>e.cost?{min:e.cost.min*a,max:e.cost.max*a}:null,ti=e=>e.reduce((a,t)=>t?{min:a.min+t.min,max:a.max+t.max}:a,{min:0,max:0});function Ns(e,a){const t=a;let r=1;return e.heat==="tank"&&t>25?r=1-.004*(t-25):e.heat==="motor"&&t>30?r=1-.005*(t-30):e.heat==="cold"&&t>25?r=1-.015*(t-25):e.heat==="visc"&&t<15&&(r=1-.005*(15-t)),Math.max(.5,r)}function lg(e,a,t){return a>=e.crit?0:(a<=e.opt?e.cap*a/e.opt:e.cap*(1+.5*(a/e.opt-1)))*Ns(e,t)}function ni(e,a){return a>=e.crit?1:a<=e.opt?.02:a<=e.warn?.02+(a-e.opt)/(e.warn-e.opt)*.08:.1+(a-e.warn)/(e.crit-e.warn)*.3}function cg(e,a){return a>=e.crit?"falha":a>e.warn?"critico":a>e.opt?"alerta":"normal"}function ce(e,a,t){const{catalog:r,ambient:s,estop:o,run:i}=t,l={};e.forEach(g=>{l[g.id]={n:g,t:r[g.type]
