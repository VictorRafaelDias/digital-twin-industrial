amente é o gargalo. Cuidado com o nível muito baixo (falta de água) ou muito alto (risco de transbordar)."},recepcao_fruta:{long:"Ponto onde as laranjas chegam à fábrica, são descarregadas e seguem para a lavagem.",how:"A taxa de recepção é quantos quilos de fruta entram por hora. Receber mais do que a lavadora e a extratora aguentam só forma fila.",tips:"Frutas de má qualidade aumentam o descarte e reduzem o rendimento de suco."},tanque_xarope:{long:"Reservatório do xarope, a mistura concentrada de açúcar e sabor que será diluída na água.",how:"A dosagem é quantos litros de xarope saem por hora. A proporção com a água define o sabor e a doçura (Brix) da bebida.",tips:"O xarope é grosso: a temperatura certa evita dosagem irregular."},misturador:{long:"Mistura a água com o xarope até a bebida ficar uniforme.",how:"A rotação (RPM) é a velocidade da pá. Girar mais rápido mistura mais rápido, mas aumenta o desgaste e a vibração.",tips:"Vibração alta é sinal de desgaste. Perto do limite de rotação, a máquina pode falhar."},lavadora_frutas:{long:"Lava e higieniza as laranjas antes de espremer, tirando terra e sujeira da casca.",how:"A vazão de lavagem é quantos quilos de fruta passam por hora. Passar rápido demais lava mal.",tips:"Lavagem ruim compromete a segurança do suco."},extratora:{long:"Espreme as laranjas e separa o suco da casca e do bagaço.",how:"A velocidade (RPM) define quantas frutas são espremidas por hora. Muito rápido reduz o rendimento e desgasta a máquina.",tips:"É a etapa que mais influencia o rendimento (litros de suco por quilo de fruta)."},filtro_despolpadeira:{long:"Retira bagaço, sementes e fiapos do suco, deixando a textura desejada.",how:"A vazão de filtragem é quantos litros passam por hora. Forçar a vazão entope o filtro.",tips:"Precisa de limpeza frequente; filtro entupido derruba a produção."},pasteurizador:{long:"Aquece a bebida por um tempo controlado para eliminar micro-organismos e aumentar a validade.",how:"A vazão é quanto líquido passa por hora. Acima do ótimo o líquido passa rápido demais pelo calor, e o tratamento pode ficar incompleto.",tips:"A temperatura precisa ficar numa faixa segura: abaixo dela o lote pode ser reprovado; acima dela aumenta o gasto de energia e o desgaste. Suco natural não passa por esta etapa."},carbonatador:{long:"Dissolve gás carbônico (CO₂) na bebida para torná-la gaseificada.",how:"A vazão é quanto líquido recebe gás por hora. Pressão de CO₂ baixa deixa a bebida sem gás; alta demais traz risco de estouro.",tips:"Só existe em bebidas com gás."},enchedora:{long:"Coloca a bebida dentro das garrafas, uma a uma, em alta velocidade.",how:"A cadência é quantas garrafas por minuto. Mais cadência produz mais, mas aumenta a vibração e o risco de falha.",tips:"Costuma ser o coração e o gargalo da linha. Mesmo parada, consome energia."},envasadora_suco:{long:"Enche as garrafas de suco natural, em escala menor e geralmente mais simples que a enchedora industrial.",how:"A cadência é quantas garrafas por minuto. Em operações pequenas ela costuma ser o gargalo.",tips:"Precisa de higiene rigorosa, já que o suco natural não é pasteurizado."},esteira:{long:"Leva as garrafas de uma máquina para a outra.",how:"A velocidade (m/s) define o ritmo do transporte. Rápida demais derruba garrafas; lenta demais forma fila.",tips:"Corrente do motor acima do limite superaquece. Raramente é o gargalo."},rotuladora:{long:"Cola o rótulo nas garrafas já cheias.",how:"A cadência é quantas garrafas por minuto recebem rótulo. Se for menor que a da enchedora, ela vira o gargalo da linha.",tips:"Mesmo parada, gasta bastante energia (consumo de espera mais alto que o das outras)."},camara_fria:{long:"Guarda o suco refrigerado até a expedição, mantendo-o seguro e fresco.",how:"A vazão de resfriamento é quantas garrafas por hora conseguem ser resfriadas. Se for menor que o envase, forma fila de garrafas quentes.",tips:"Em suco natural, o frio é o que protege o produto: a temperatura deve ficar entre 1 e 4 °C." 200 garrafas produzidas…”) aparece na aba Registro, no painel da direita.","No fim, um resumo mostra produção, energia, risco e gargalo."],tip:"Os números “fila” mostram o excesso que uma máquina entrega a mais do que a seguinte aguenta."},{id:"ambiente",title:"5. Temperatura do ambiente",img:"05-ambiente.jpg",what:"Veja como o calor e o frio mudam o desempenho da fábrica.",does:["Na caixa Ambiente, digite a temperatura ou clique em Efeitos para abrir os detalhes.","Escolha uma situação pronta (Inverno, Ideal, Verão, Calor extremo) ou ajuste no controle.","Veja quanto cada máquina perde de capacidade e quanto cai a produção.","Veja a dilatação da água e em que o cálculo se baseia (com link)."],tip:"Os percentuais por grau são hipótese didática e estão marcados assim."},{id:"objetivo",title:"6. Objetivo",img:"06-objetivo.jpg",what:"Diga o que você quer e o sistema mostra o que fazer.",does:["Escolha o objetivo: aumentar a produção em %, chegar a uma meta ou reduzir o risco.","Clique em Ver o que fazer: aparece o passo a passo, com o porquê de cada passo e o antes/depois.","Se não der só ajustando, ele sugere usar mais unidades em paralelo e mostra o investimento estimado.","Aplicar na fábrica faz as mudanças valerem."],tip:"As palavras sublinhadas têm explicação: passe o mouse ou clique para abrir o glossário."},{id:"maquina",title:"7. Máquina",img:"07-maquina.jpg",what:"Os detalhes e o ajuste da máquina selecionada.",does:["Mude o ritmo digitando, com − e +, ou pelo controle deslizante.","Veja capacidade, saída real, risco e consumo.","Use unidades em paralelo, ligar/desligar e Testar falha.","Em Mais detalhes: de onde vêm os números e o preço estimado, com links."],tip:"Clique em “Risco” para entender o que pode acontecer fisicamente."},{id:"conversa",title:"8. Conversa",img:"08-conversa.jpg",what:"Um assistente que analisa a sua fábrica e consulta manuais.",does:["Pergunte onde está o gargalo, quanto custa melhorar, o que acontece se uma máquina falhar ou como funciona uma máquina.","Peça “quero aumentar 10%” e aplique o plano com um clique.","As respostas mostram a fonte consultada."],tip:"No protótipo a leitura dos manuais é de exemplo."},{id:"painel",title:"9. Painel da máquina",img:"09-painel.jpg",what:"A tela de configuração de uma máquina, como o operador vê na fábrica.",does:["Escolha a máquina na faixa do processo.","Ajuste o ritmo com os botões grandes ▲▼ ou use uma receita: Econômico, Padrão ou Máximo seguro.","Ligue ou desligue a máquina e mude as unidades em paralelo.","O botão vermelho simula a parada de emergência."],tip:"Boa tela para apresentar como uma máquina é configurada."},{id:"fisica",title:"10. Fábrica vista de cima",img:"10-fisica.jpg",what:"A planta baixa: onde cada máquina fica no chão da fábrica.",does:["Cada máquina aparece na sua área (recepção, térmico, envase, frio).","Ligue “Por onde o produto passa” e “Quem gasta mais energia”."],tip:"No fluxo do suco natural a área térmica fica vazia: não há pasteurização."},{id:"resultados",title:"11. Resultados e avisos",img:"11-resultados.jpg",what:"Os números da fábrica, explicados, e o porquê do gargalo.",does:["Produção, eficiência, risco e energia (em kW e em reais).","Em Avisos: por que existe um gargalo, como melhorar e quanto custa. Botão “Explorar no chat” leva a conversa já orientada.","Em “Simular uma melhoria”: teste colocar 1, 2 ou mais máquinas e veja se outra máquina vira o gargalo; o plano completo recalcula tudo em cascata, com o custo.","Capacidade e saída de cada máquina, com a fila de excesso. A mais curta é o gargalo.","Antes e depois: marque um ponto de partida e compare."],tip:"A eficiência compara a produção com o máximo que a fábrica faria no ótimo."},{id:"simular",title:"12. Simular uma melhoria",img:"12-simular.jpg",what:"Teste uma melhoria antes de comprar: o sistema recalcula tudo e mostra se outra máquina vira o gargalo.",does:["Em Resultados › Avisos, role até “Simular uma melhoria”.","Escolha quantas máquinas a mais colocar
