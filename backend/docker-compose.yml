# Sobe o PostgreSQL 16 e a API juntos:
#   cd backend && docker compose up --build
# Depois abra http://localhost:8000/docs  (usuário de demonstração: victor.dias / senha1234)
# Para apagar o banco e recomeçar: docker compose down -v
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digital_twin
      POSTGRES_USER: digital_twin
      POSTGRES_PASSWORD: digital_twin      # apenas para uso local
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_twin -d digital_twin"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://digital_twin:digital_twin@banco:5432/digital_twin
      SECRET_KEY: troque-esta-chave
    depends_on:
      banco:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dados:
