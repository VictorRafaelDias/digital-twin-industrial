# Site do Digital Twin no Docker: o nginx só ENTREGA o arquivo pronto da pasta ABRIR_AQUI (nada é compilado no Docker,
# então o "ligar tudo" não depende de npm nem de internet). Depois de mudar o código do site: cd app && npm run build:single
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # No Docker o servidor está ligado: a tela de login já abre com "Usar o servidor" marcado.
        sub_filter '<head>' '<head><script>try{localStorage.setItem("dtw_use_server","1")}catch(e){}</script>';
        sub_filter_once on;
        add_header Cache-Control "no-store";
    }
}
